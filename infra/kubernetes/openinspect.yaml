apiVersion: apps/v1
kind: Deployment
metadata: {name: openinspect-api}
spec:
  replicas: 2
  selector: {matchLabels: {app: openinspect-api}}
  template:
    metadata: {labels: {app: openinspect-api}}
    spec:
      containers:
        - name: api
          image: ghcr.io/example/openinspect-api:0.1.0
          ports: [{containerPort: 8000}]
          envFrom: [{secretRef: {name: openinspect-secrets}}]
          readinessProbe: {httpGet: {path: /ready, port: 8000}, initialDelaySeconds: 5, periodSeconds: 10}
          livenessProbe: {httpGet: {path: /health, port: 8000}, initialDelaySeconds: 10, periodSeconds: 20}
---
apiVersion: v1
kind: Service
metadata: {name: openinspect-api}
spec:
  selector: {app: openinspect-api}
  ports: [{port: 8000, targetPort: 8000}]
