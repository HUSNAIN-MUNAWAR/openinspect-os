services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: openinspect
      POSTGRES_USER: openinspect
      POSTGRES_PASSWORD: openinspect-dev
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openinspect"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - openinspect-db:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes

  minio:
    image: minio/minio:latest
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: openinspect
      MINIO_ROOT_PASSWORD: openinspect-dev-secret
    volumes:
      - openinspect-objects:/data

  api:
    build:
      context: ../..
      dockerfile: infra/docker/api.Dockerfile
    environment:
      OPENINSPECT_DATABASE_URL: postgresql+psycopg://openinspect:openinspect-dev@db:5432/openinspect
      OPENINSPECT_OBJECT_ROOT: /data/objects
      OPENINSPECT_ALLOWED_ORIGINS: http://localhost:3000
      OPENINSPECT_JWT_SECRET: change-this-in-production
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    ports: ["8000:8000"]
    volumes:
      - openinspect-objects:/data/objects

  web:
    build:
      context: ../..
      dockerfile: infra/docker/web.Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    depends_on: [api]
    ports: ["3000:3000"]

volumes:
  openinspect-db:
  openinspect-objects:
