name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install -e .[dev]
      - run: ruff check .
      - run: mypy services apps/api/openinspect_api
      - run: pytest --cov=services --cov=openinspect_api
      - run: make demo
      - uses: actions/upload-artifact@v4
        with: {name: demo-artifacts, path: demo/outputs}
  frontend:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: apps/web}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "22", cache: npm, cache-dependency-path: apps/web/package-lock.json}
      - run: npm install
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - run: docker build -f infra/docker/api.Dockerfile -t openinspect-api:test .
      - run: docker build -f infra/docker/web.Dockerfile -t openinspect-web:test .
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
        if: github.event_name == 'pull_request'
      - uses: aquasecurity/trivy-action@v0.35.0
        with: {scan-type: fs, scan-ref: ., severity: HIGH,CRITICAL, exit-code: "0"}
