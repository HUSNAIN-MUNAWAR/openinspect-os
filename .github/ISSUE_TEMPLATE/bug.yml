name: Bug report
description: Reproducible software defect
body:
  - type: textarea
    id: repro
    attributes: {label: Reproduction, description: Include commands and sanitized inputs}
    validations: {required: true}
  - type: textarea
    id: expected
    attributes: {label: Expected behavior}
  - type: checkboxes
    id: safety
    attributes:
      label: Safety
      options:
        - label: I did not attach credentials, customer data or sensitive infrastructure media.
          required: true
